name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Stage 1: code quality ─────────────────────────────────
  quality:
    name: "Stage 1 · Quality (ruff + mypy)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Lint (ruff)
        run: python -m ruff check --output-format=github .
      - name: Typecheck (mypy, informational)
        # the typing backlog is tracked in pyproject [tool.mypy]; it must not hide a real failure, so it reports only
        continue-on-error: true
        run: python -m mypy jaga --ignore-missing-imports

  # ── Stage 2: security (parallel with stage 1) ─────────────
  security:
    name: "Stage 2 · Security (pip-audit)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -U pip setuptools wheel   # the audit covers the whole interpreter environment
      - run: pip install -r requirements-ci.txt
      - name: Dependency audit (pip-audit)
        run: python -m pip_audit --skip-editable   # audits the installed environment (same as `make audit`)
      - name: Shipped model stack (requirements.lock), informational
        # the CI install has no torch/transformers; this audits the versions the product pins (see SECURITY.md)
        continue-on-error: true
        run: python -m pip_audit -r requirements.lock --no-deps --disable-pip

  # ── Stage 3: tests (does not wait for the audit: a newly published CVE must not hide test results) ──
  test:
    name: "Stage 3 · Tests (Python ${{ matrix.python }})"
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # full matrix on main, one version on pull requests
        python: ${{ github.event_name == 'push' && fromJSON('["3.11", "3.12"]') || fromJSON('["3.11"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: pip install --no-deps -e .
      - name: ffmpeg (three tests cut or retime real clips; they skip when it is missing)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: pytest with coverage
        # no test loads the Cosmos model or calls Token Factory: vectors are scripted and the plug is a fake LAN server
        run: python -m pytest --cov=jaga --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.11'
        with:
          name: coverage-xml
          path: coverage.xml

  # ── Stage 4: the safety path and the submission checks ────
  gates:
    name: "Stage 4 · Offline trip + readiness"
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the readiness script reads git history to date each measured section
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: pip install --no-deps -e .
      - name: A tripwire trips and the plug goes OFF with every non-LAN connection refused (fake LAN plug, no model)
        run: python scripts/verify_offline.py
      - name: Submission readiness (the video URL is added by hand at submission)
        # on main this is a gate: a measured DEMO.md section older than the code it measured fails it. On a pull request
        # it only reports, because re-measuring needs the model on a laptop (see CONTRIBUTING)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python scripts/check_submission_readiness.py --allow video

  # ── Stage 5: merge gate ───────────────────────────────────
  ci-pass:
    name: "Stage 5 · CI gate"
    if: ${{ !cancelled() }}
    needs: [quality, security, test, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "quality=${{ needs.quality.result }} security=${{ needs.security.result }} test=${{ needs.test.result }} gates=${{ needs.gates.result }}"
          test "${{ needs.quality.result }}" = success && test "${{ needs.security.result }}" = success \
            && test "${{ needs.test.result }}" = success && test "${{ needs.gates.result }}" = success
