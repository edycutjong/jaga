[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaga"
version = "0.1.0"
description = "Type what to watch for: NVIDIA Cosmos-Embed1 watches a webcam and a smart plug acts. No model training, no cloud video."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python>=4.10,<5",   # 5.0 dropped cv2.HOGDescriptor (the person-in-zone baseline)
  "av>=12",
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers==4.51.3",     # the version day-0 stage COSMOS measured with trust_remote_code
  "einops>=0.8",
  "openai>=1.40",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "tinytuya>=1.13",
  "boto3>=1.34",
  "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
jaga = "jaga.cli:main"

[tool.setuptools.packages.find]
include = ["jaga*"]

[tool.setuptools.package-data]
jaga = ["static/*", "static/fonts/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# day-0 scripts are kept byte-identical to the runs that produced evidence/day0/
"scripts/day0_*.py" = ["B905", "E501", "I001"]
"jaga/receipts.py" = ["E501"]
# the compiler prompt and the RUNS.md header are text, kept verbatim (fixtures pin the prompt hash)
"jaga/compile.py" = ["E501"]
"jaga/calibrate.py" = ["E501"]
